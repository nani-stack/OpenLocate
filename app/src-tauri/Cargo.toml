[package]
name = "openlocate"
version = "0.1.0"
description = "Desktop app that simulates an iPhone's GPS location"
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "openlocate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
openlocate-sidecar-host = { path = "sidecar-host" }
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
members = ["sidecar-host"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints]
workspace = true
