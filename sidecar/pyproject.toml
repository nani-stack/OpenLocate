[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openlocate"
dynamic = ["version"]
description = "OpenLocate sidecar: route engine, device backends and JSON-RPC server"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
# Only openlocate.device.pmd3 imports pymobiledevice3; everything else is standard library.
# The library releases several times a week and its API moves, so the range is narrow.
dependencies = [
    "pymobiledevice3>=11.54,<12",
    "packaging>=23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Only needed to build the standalone helper that ships inside the app (packaging/build.py).
build = [
    "pyinstaller==6.22.3",
]

[tool.setuptools.dynamic]
version = { attr = "openlocate.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
